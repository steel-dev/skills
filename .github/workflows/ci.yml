name: Skills CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate skills catalog
        run: node scripts/validate-skills.mjs
      - name: Check marketplace.json is in sync with manifest
        run: node scripts/generate-marketplace.mjs --check
      - name: Check Codex plugin artifacts are in sync with manifest
        run: node scripts/generate-codex.mjs --check
      - name: Smoke test skills installer
        run: npx skills add . --list
